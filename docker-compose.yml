services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://connectsphere:${POSTGRES_PASSWORD:-connectsphere-local}@db:5432/connectsphere
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: connectsphere
      POSTGRES_USER: connectsphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connectsphere-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectsphere -d connectsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  media_data:
