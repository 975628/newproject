services:
  - type: web
    name: connectsphere-975628
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: connectsphere-975628.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://connectsphere-975628.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: connectsphere-db
          property: connectionString

databases:
  - name: connectsphere-db
    databaseName: connectsphere
    user: connectsphere
    plan: free
    region: singapore
    postgresMajorVersion: "16"
