{% extends "base.html" %}

{% block title %}Edit profile | ConnectSphere{% endblock %}

{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto"><div class="card-body p-4">
    <h1 class="h3 mb-3">Edit your profile</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>
        {% endfor %}
        <button class="btn btn-primary" type="submit">Save profile</button>
        <a class="btn btn-link" href="{% url 'profile' user.username %}">Cancel</a>
    </form>
</div></div>
{% endblock %}
